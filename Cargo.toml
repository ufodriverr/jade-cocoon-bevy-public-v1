[workspace]
resolver = "3"
members = [
    "crates/jc-android",
    "crates/jc-disc",
    "crates/jc-formats",
    "crates/jc-game",
    "crates/jc-net",
]
# The Android library is built by `android/build-apk.ps1` only.
default-members = ["crates/jc-disc", "crates/jc-formats", "crates/jc-game", "crates/jc-net"]

[workspace.package]
version = "1.1.2"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
arboard = { version = "3", default-features = false }
bevy = "0.19.1"
blake3 = "1.8"
crossbeam-channel = "0.5"
if-addrs = "0.15"
# A host by address asks the router to forward its port (UPnP); never in a check.
igd-next = "0.17"
# The room code of the internet play: QUIC between two players by public key, through
# NAT, with n0's public relays as the fallback. Its own portmapper (UPnP, PCP, NAT-PMP)
# is off in checks.
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "portmapper"] }
jc-disc = { path = "crates/jc-disc" }
jc-formats = { path = "crates/jc-formats" }
jc-net = { path = "crates/jc-net" }
png = "0.18"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
toml = "0.9"

# Bevy is unusably slow unoptimized; keep our own crates quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The native library of the APK (`android/build-apk.ps1`): a release without its debug
# info, which Gradle would otherwise pack (the names stay, for a crash's backtrace).
[profile.android]
inherits = "release"
strip = "debuginfo"

[profile.release]
# Avoid embedding local developer paths in debug information.
debug = false
strip = "debuginfo"
